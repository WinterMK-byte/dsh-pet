name: CI

on:
  push:
    branches: [main, master]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: 门禁（泄漏 / 语法 / 依赖 / 配置）
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 泄漏检查器自测
        run: python tools/leak_check.py --selftest

      - name: 泄漏检查（绝对路径 / 凭据 / 私人信息）
        run: python tools/leak_check.py .

      - name: 语法编译
        run: python -m py_compile main.py smoke_test2.py tools/leak_check.py

      - name: 依赖清单可解析
        run: |
          python -m pip install --quiet packaging
          python -c "import sys; from packaging.requirements import Requirement; [Requirement(l.strip()) for l in open('requirements.txt', encoding='utf-8') if l.strip() and not l.strip().startswith('#')]; print('requirements.txt OK')"

      - name: config.json 合法且字段齐全
        run: |
          python -c "import json,sys; c=json.load(open('config.json',encoding='utf-8')); need={'ollama_base_url','model','hotkey','auto_start','pet_size','opacity'}; miss=need-set(c); print('config.json OK' if not miss else 'config.json 缺字段: %s' % miss); sys.exit(1 if miss else 0)"
